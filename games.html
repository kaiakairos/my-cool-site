<script>

const allGameBoxDivs = document.querySelectorAll('.gameBox');

allGameBoxDivs.forEach(hoveredBox => {
	hoveredBox.addEventListener('mouseenter', () => {
		allGameBoxDivs.forEach(div => {
			if (div !== hoveredBox) { div.classList.add('quiet'); }
		});
	});

	hoveredBox.addEventListener('mouseleave', () => {allGameBoxDivs.forEach(div => { 
		div.classList.remove('quiet'); 
	}); }
  );
});



</script>
