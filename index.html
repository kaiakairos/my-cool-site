<!DOCTYPE html>
<html>
<head>

<title>kaiakairos.net</title> <!-- sets tab name -->
<link rel="icon" href="images/icon.png"> <!-- sets tab icon -->
<link rel="stylesheet" href="indexStyle.css"> <!-- gets css -->

</head>

<script>

function ribbonPush(index) {
	document.getElementById("ribbon" + index).style.animation="navRibbonPush 0.1s ease forwards";
	
	for (let i = 0; i < 6; i++) {
		document.getElementById("navBox" + i).style.animation = "none";
		document.getElementById("navBox" + i).style.filter = "brightness(150%)";
		if (i == index){document.getElementById("navBox" + i).style.backgroundPosition = "0px 0px";continue;}
		document.getElementById("navBox" + i).style.backgroundPosition = "-64px 0px";
		document.getElementById("navBox" + i).style.filter = "brightness(20%)";
	}
	
}

function ribbonPutAway(index) {
	document.getElementById("ribbon" + index).style.animation="navRibbonPushBack 0.1s ease forwards";
	for (let i = 0; i < 6; i++) {
		
		document.getElementById("navBox" + i).style.animation = "shuffle 2s ease-in-out infinite";
		document.getElementById("navBox" + i).style.animationDelay = ((5 - i) * -0.3) + "s";
		document.getElementById("navBox" + i).style.filter = "none";
	}
}

function setAllRibbons() {
	for (let i = 0; i < 6; i++) {
	document.getElementById("ribbon" + i).style.transform = "translate(-20px, "+((i*80) + 1)+"px )";
	}
}

function emptyLinkText() {
	document.getElementById("linkPreview").textContent = "";
}

function setLinkPreviewText(text) {
	document.getElementById("linkPreview").textContent = text;
}

function setFeatureBox(index,text,img,link) {
	document.getElementById("featureBox" + index).style.backgroundImage = "url('images/homePage/bannerClouds.png'),url('images/FBanners/"+img+".png')"; 
	document.getElementById("featureText" + index).textContent = text;
	document.getElementById("featureLink" + index).href = link;
}

function initializePage() {
	setAllRibbons();
	setFeatureBox(0,"waxweaver available on steam for free!","waxweaver1","https://store.steampowered.com/app/3599070/waxweaver/");
	setFeatureBox(1,"art world","art","https://kaiakairos.newgrounds.com/art");
	setFeatureBox(2,"rpg game in development","rpgPreview","https://www.youtube.com/watch?v=csKB4ibijx4");
}

</script>
